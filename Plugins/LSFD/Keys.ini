; LSFD key bindings, in GTA V\Plugins\LSFD\.
; Key names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys

[Keys]
; Opens the fire department tablet (dispatch, vehicle control, scene management).
TabletKey=F7
InteractKey=E
AcceptCalloutKey=Y
; Switch the nozzle between a straight stream and a wide fog pattern.
NozzlePatternKey=X
; Nozzle pressure (the mouse wheel works as well).
PressureUpKey=PageUp
PressureDownKey=PageDown
; Put the SCBA face piece on or off (you breathe from your cylinder while it is on).
MaskKey=K
; Turn the thermal imaging camera on or off (take one from an engine first).
ThermalCameraKey=T
