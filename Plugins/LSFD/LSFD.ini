; LSFD plugin settings, in GTA V\Plugins\LSFD\. Keys are set in Keys.ini.

[Duty]
; Switch to a firefighter model while on duty (your original model is restored when going off duty).
ChangeModelOnDuty=true

[Water]
; Liters per second a hydrant pumps into a connected apparatus.
HydrantFlowRate=80
; Rope style used for hoses (0-7).
HoseRopeType=4
; Hide the fire extinguisher used as nozzle, so the hose ends in your hand.
HideNozzleWeapon=true

[Fire]
; How fast fires grow and spread; 2 is twice as fast, 0.5 half as fast.
GrowthMultiplier=1.0
; Fires that grow too big go to the next alarm, and dispatch sends another engine.
AlarmEscalation=true
; Chance (0-1) that a hotspot you didn't overhaul rekindles each time it gets the chance (every 45-90 seconds).
RekindleChance=0.5
; Smoke columns over fires that you can see from far away while responding.
SmokeColumns=true

[Safety]
; How long a full SCBA cylinder lasts, in seconds of breathing at rest (running uses more).
AirSupplySeconds=600
; Turnout gear stops GTA fire from setting you alight; the heat near the fire still hurts.
TurnoutGearFireProof=true
; Breathing smoke without your mask and standing in high heat cost health.
SmokeAndHeatDamage=true
; Smoke limits what you can see inside burning buildings.
SmokeScreenEffect=true

[Interiors]
; Auto detects the Enable All Interiors mod (scripts/EnableAllinteriors.dll); Enabled/Disabled overrides that.
; Callouts that need interiors that are normally locked are only dispatched when it is installed.
EnableAllInteriors=Auto

[Callouts]
Enabled=true
; Turn whole kinds of calls on or off.
FireCalls=true
TrafficCalls=true
MedicalCalls=true
RescueCalls=true
MinSecondsBetweenCallouts=90
MaxSecondsBetweenCallouts=240
; Seconds you get to accept a dispatched call before it is cancelled.
AcceptTimeoutSeconds=20
