; LSFD plugin settings, in GTA V\Plugins\LSFD\. Keys are set in Keys.ini.

[Duty]
; Switch to a firefighter model while on duty (your original model is restored when going off duty).
ChangeModelOnDuty=true

[Water]
; Liters per second a hydrant pumps into a connected apparatus.
HydrantFlowRate=80
; Rope style used for hoses (0-7).
HoseRopeType=4
; Hide the fire extinguisher used as nozzle, so the hose ends in your hand.
HideNozzleWeapon=true

[Station]
; When you go on duty, an engine stands ready at the station with its crew waiting in quarters.
FirstDueEngine=true
; Calls accepted while you're at the station sound the station alarm; the crew runs to the engine and your turnout time is shown.
; Put a StationAlarm.wav in Audio/Alarms/ for real station tones.
StationAlarm=true

[Fire]
; How fast fires grow and spread; 2 is twice as fast, 0.5 half as fast.
GrowthMultiplier=1.0
; Fires that grow too big go to the next alarm, and dispatch sends another engine.
AlarmEscalation=true
; Chance (0-1) that a hotspot you didn't overhaul rekindles each time it gets the chance (every 45-90 seconds).
RekindleChance=0.5
; Smoke columns over fires that you can see from far away while responding.
SmokeColumns=true

[Safety]
; How long a full SCBA cylinder lasts, in seconds of breathing at rest (running uses more).
AirSupplySeconds=600
; Turnout gear stops GTA fire from setting you alight; the heat near the fire still hurts.
TurnoutGearFireProof=true
; Breathing smoke without your mask and standing in high heat cost health.
SmokeAndHeatDamage=true
; Smoke limits what you can see inside burning buildings.
SmokeScreenEffect=true

[Ventilation]
; Prop used as PPV fan; an add-on fan prop works too. FanHeading (degrees) turns it if it blows the wrong way.
FanModel=prop_ld_fan_01
FanHeading=0

[Medical]
; Stable patients are taken to hospital by an AI ambulance (2 paramedics with a stretcher) before a call is over.
PatientTransport=true
; Prop used as stretcher. Any (add-on) prop works; tune the two values below if it sits wrong.
StretcherModel=v_med_emptybed
; Rotation of the stretcher prop in degrees, so its long side points the way it is pushed (try 90 if it is sideways).
StretcherHeading=0
; Extra height (m) of the patient lying on the stretcher.
PatientOnStretcherHeight=0

[Interiors]
; Auto detects the Enable All Interiors mod (scripts/EnableAllinteriors.dll); Enabled/Disabled overrides that.
; Callouts that need interiors that are normally locked are only dispatched when it is installed.
EnableAllInteriors=Auto

[Callouts]
Enabled=true
; Turn whole kinds of calls on or off.
FireCalls=true
TrafficCalls=true
MedicalCalls=true
RescueCalls=true
HazmatCalls=true
MinSecondsBetweenCallouts=90
MaxSecondsBetweenCallouts=240
; Seconds you get to accept a dispatched call before it is cancelled.
AcceptTimeoutSeconds=20

[World]
; Turns GTA's own fire trucks and ambulances off while you're on duty, so they don't race you to every fire and crash.
DisableGameFireDispatch=true
; Traffic slows down around your scene and around parked apparatus with their lights on, and you can place traffic cones
; (take them from the apparatus, hold E on the road) that stop traffic. Cones you leave behind are picked up once you're far away.
TrafficControl=true
; A police car comes to crashes, hazmat calls and fires of a 2nd alarm or more: it blocks the road with its lights on,
; puts out cones and an officer directs traffic. Sheriff units in Blaine County.
PoliceAtScene=true
PoliceVehicle=police
PoliceOfficerModel=s_m_y_cop_01
SheriffVehicle=sheriff
SheriffOfficerModel=s_m_y_sheriff_01
; Now and then you come across an incident on the road ahead while driving around on duty (a crash, a car fire, someone down).
AmbientIncidents=true
MinSecondsBetweenAmbientIncidents=300
MaxSecondsBetweenAmbientIncidents=900
; Other AI units handle calls elsewhere in the city: they show on the map and the tablet, and are not available as your backup
; while busy. Units near you really drive there with lights and sirens. Calls you decline are taken over by them.
OtherUnitsIncidents=true
MinSecondsBetweenOtherIncidents=120
MaxSecondsBetweenOtherIncidents=360
; Show a notification when another unit is dispatched.
OtherUnitsNotifications=true
